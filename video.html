<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #101426; color: white; }
        header { padding: 22px; text-align: center; background: #1b2340; }
        .container { max-width: 850px; margin: 35px auto; padding: 25px; background: #1b2340; border-radius: 16px; }
        h1, h2 { text-align: center; }
        label { display: block; margin: 18px 0 8px; }
        textarea, select { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #536080; font-size: 16px; }
        textarea { min-height: 180px; resize: vertical; }
        button { width: 100%; margin-top: 18px; padding: 16px; border: none; border-radius: 8px; background: #7657f5; color: white; font-size: 18px; cursor: pointer; }
        button:hover { background: #6040df; }
        button:disabled { opacity: .6; cursor: wait; }
        .note { text-align: center; color: #b8c2e0; margin-top: 18px; line-height: 1.5; }
        #status { overflow-wrap: anywhere; }
        .secondary { background: #35415f; }
    </style>
</head>
<body>
<header>
    <h1>AI Video Studio</h1>
    <p>Create a scene-by-scene story plan from any idea</p>
</header>
<div class="container">
    <h2>Build Your Story</h2>
    <label for="story">Enter Your Story</label>
    <textarea id="story" placeholder="Write or paste your story idea here..."></textarea>

    <button class="secondary" id="playEnglishBtn" type="button">Play English Voice</button>

    <label for="language">Voice Over Language</label>
    <select id="language"><option value="en">English</option></select>

    <label for="style">Story Style</label>
    <select id="style">
        <option value="cinematic">Cinematic</option>
        <option value="animation">3D Animation</option>
        <option value="realistic">Realistic</option>
        <option value="documentary">Documentary</option>
    </select>

    <button id="generateBtn" type="button">Generate Story Scenes</button>
    <p class="note" id="status" role="status" aria-live="polite">Ready. Enter a story idea to generate a scene-by-scene plan.</p>
    <p class="note">Note: This step generates the story and scene plan. Rendering a finished video is a separate feature that has not been connected yet.</p>
</div>
<script>
    const storyInput = document.getElementById("story");
    const styleInput = document.getElementById("style");
    const statusText = document.getElementById("status");
    const generateButton = document.getElementById("generateBtn");

    const savedStory = localStorage.getItem("videoStory");
    const savedStyle = localStorage.getItem("videoStyle");
    if (savedStory) storyInput.value = savedStory;
    if (savedStyle && [...styleInput.options].some(option => option.value === savedStyle)) {
        styleInput.value = savedStyle;
    }

    generateButton.addEventListener("click", async function () {
        const topic = storyInput.value.trim();
        const style = styleInput.value;
        if (!topic) {
            statusText.textContent = "Please enter your story idea first.";
            storyInput.focus();
            return;
        }

        generateButton.disabled = true;
        generateButton.textContent = "Generating...";
        statusText.textContent = "Connecting to Gemini and creating your scene-by-scene story plan...";

        try {
            const response = await fetch("/api/story", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ topic, style })
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.error || "The story service returned an error (HTTP " + response.status + ").");
            }
            if (!data.story) {
                throw new Error("Gemini responded, but no story text was returned.");
            }

            storyInput.value = data.story;
            localStorage.setItem("videoStory", data.story);
            localStorage.setItem("videoStyle", style);
            statusText.textContent = "Success! Your AI-generated story and scene plan are ready. You can edit the text below.";
        } catch (error) {
            statusText.textContent = "Generation failed: " + error.message;
        } finally {
            generateButton.disabled = false;
            generateButton.textContent = "Generate Story Scenes";
        }
    });

    document.getElementById("playEnglishBtn").addEventListener("click", function () {
        const text = storyInput.value.trim();
        if (!text) {
            statusText.textContent = "Enter a story before playing the voice preview.";
            storyInput.focus();
            return;
        }
        if (!("speechSynthesis" in window)) {
            statusText.textContent = "English voice playback is not supported in this browser.";
            return;
        }
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = "en-US";
        window.speechSynthesis.speak(speech);
    });
</script>
</body>
</html>
