
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101426;
            color: white;
        }

        header {
            padding: 22px;
            text-align: center;
            background: #1b2340;
        }

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 25px;
            background: #1b2340;
            border-radius: 16px;
        }

        h1, h2 {
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        textarea, select {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #536080;
            font-size: 16px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: #7657f5;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #6040df;
        }

        .note {
            text-align: center;
            color: #b8c2e0;
            margin-top: 18px;
        }
    </style>
</head>
<body>

<header>
    <h1>AI Video Studio</h1>
    <p>Create videos from any story</p>
</header>

<div class="container">
    <h2>Create Your Video</h2>

    <label for="story">Enter Your Story</label>
    <textarea id="story"
        placeholder="Write or paste your story here..."></textarea>
<button id="playEnglishBtn">Play English Voice</button>
    <label for="language">Voice Over Language</label>
    <select id="language">
        
        <option value="en">English</option>
    </select>

    <label for="style">Video Style</label>
    <select id="style">
        <option value="cinematic">Cinematic</option>
        <option value="animation">3D Animation</option>
        <option value="realistic">Realistic</option>
        <option value="documentary">Documentary</option>
    </select>

    <button id="generateBtn">Generate AI Video</button>

    <p class="note" id="status">
        Your AI Video Studio is ready.
    </p>
</div>

<script>
 const savedStory = localStorage.getItem("videoStory");

if (savedStory) {
    document.getElementById("story").value = savedStory;
}

document.getElementById("generateBtn").addEventListener("click", async function() {
    const story = document.getElementById("story").value.trim();
    const style = document.getElementById("style").value;

    if (!story) {
        alert("Please enter your story.");
        return;
    }

    document.getElementById("status").textContent = "Writing your story...";

    try {
        const response = await fetch("/api/story", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic: story, style: style })
        });

        const data = await response.json();

        if (data.story) {
            document.getElementById("story").value = data.story;
            document.getElementById("status").textContent = "Story is ready!";
        } else {
            document.getElementById("status").textContent = "Something went wrong.";
        }
    } catch (error) {
        document.getElementById("status").textContent = "Could not reach the server.";
    }
});

document.getElementById("playEnglishBtn").addEventListener("click", function() {
    const story = document.getElementById("story").value.trim();

    if (!story) {
        alert("Please enter your story.");
        return;
    }

    window.speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(story);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
});  
   
 
</script>

</body>
</html>
